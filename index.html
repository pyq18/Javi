
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Javier 💙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #f0f8ff, #e3f2fd);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      color: #527da3;
    }

    .container {
      text-align: center;
      width: 100%;
      padding: 20px;
    }

    h1 {
      color: #659bc9;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8bb4d8;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .bouquet {
      position: relative;
      width: 340px;
      height: 390px;
      margin: 0 auto;
    }

    /* Golf balls */
    .ball {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background-color: #ffffff;
      background-image: radial-gradient(
        circle,
        #d4dce4 1.5px,
        transparent 2px
      );
      background-size: 10px 10px;
      border: 1px solid #dbe8f2;
      box-shadow: 0 5px 10px rgba(91, 135, 173, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 7;
    }

    .ball::after {
      content: "♥";
      color: #91c5ed;
      font-size: 25px;
      text-shadow: 0 1px 2px #ffffff;
    }

    .ball1 {
      top: 5px;
      left: 132px;
    }

    .ball2 {
      top: 45px;
      left: 70px;
    }

    .ball3 {
      top: 45px;
      left: 194px;
    }

    .ball4 {
      top: 95px;
      left: 35px;
    }

    .ball5 {
      top: 95px;
      left: 229px;
    }

    .ball6 {
      top: 105px;
      left: 100px;
    }

    .ball7 {
      top: 105px;
      left: 164px;
    }

    /* Stems */
    .stems {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 220px;
      z-index: 4;
      overflow: visible;
    }

    .stem {
      position: absolute;
      width: 4px;
      height: 115px;
      background: linear-gradient(to right, #80a98b, #a9cbb0);
      border-radius: 5px;
      top: 15px;
      transform-origin: top center;
    }

    /* Middle golf ball stem: starts higher and extends farther */
    .stem1 {
      left: 100px;
      top: -75px;
      height: 245px;
      transform: rotate(0deg);
    }

    .stem2 {
      left: 65px;
      transform: rotate(-12deg);
    }

    .stem3 {
      left: 135px;
      transform: rotate(12deg);
    }

    .stem4 {
      left: 35px;
      transform: rotate(-20deg);
    }

    .stem5 {
      left: 165px;
      transform: rotate(20deg);
    }

    .stem6 {
      left: 80px;
      transform: rotate(-7deg);
    }

    .stem7 {
      left: 120px;
      transform: rotate(7deg);
    }

    /* Leaves */
    .leaf {
      position: absolute;
      width: 27px;
      height: 13px;
      background: #a7cdb0;
      border-radius: 100% 0 100% 0;
      z-index: 5;
    }

    .leaf1 {
      top: 195px;
      left: 90px;
      transform: rotate(-25deg);
    }

    .leaf2 {
      top: 205px;
      left: 175px;
      transform: rotate(35deg);
    }

    .leaf3 {
      top: 215px;
      left: 110px;
      transform: rotate(15deg);
    }

    .leaf4 {
      top: 225px;
      left: 155px;
      transform: rotate(-35deg);
    }

    /* Pastel blue wrapper */
    .wrapper {
      position: absolute;
      top: 185px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 145px;
      background: linear-gradient(135deg, #d6ecff, #a8d5f5);
      clip-path: polygon(12% 0, 88% 0, 100% 100%, 0 100%);
      border-radius: 0 0 20px 20px;
      z-index: 8;
      box-shadow: 0 8px 15px rgba(91, 135, 173, 0.12);
    }

    .wrapper::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 100%;
      background: rgba(255, 255, 255, 0.35);
    }

    /* Ribbon */
    .ribbon {
      position: absolute;
      top: 275px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 30px;
      background: #83bce8;
      border-radius: 8px;
      z-index: 10;
      box-shadow: 0 3px 6px rgba(91, 135, 173, 0.15);
    }

    .ribbon::before,
    .ribbon::after {
      content: "";
      position: absolute;
      top: 10px;
      width: 30px;
      height: 35px;
      background: #a8d5f5;
      z-index: -1;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%);
    }

    .ribbon::before {
      left: -20px;
      transform: rotate(25deg);
    }

    .ribbon::after {
      right: -20px;
      transform: rotate(-25deg);
    }

    /* Message */
    .message {
      margin-top: -5px;
      color: #659bc9;
      font-size: 17px;
      line-height: 1.6;
    }

    button {
      margin-top: 12px;
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      background: #91c5ed;
      color: white;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(91, 135, 173, 0.15);
      transition: 0.3s;
    }

    button:hover {
      background: #75b3e4;
      transform: translateY(-2px);
    }

    .hidden-message {
      display: none;
      margin: 15px auto 0;
      max-width: 300px;
      color: #527da3;
      line-height: 1.5;
    }

    .hidden-message.show {
      display: block;
      animation: fadeIn 0.8s ease;
    }

    /* Floating hearts */
    .floating-heart {
      position: fixed;
      bottom: -30px;
      color: #91c5ed;
      font-size: 20px;
      animation: floatUp 5s linear forwards;
      pointer-events: none;
      z-index: 20;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      to {
        transform: translateY(-100vh) rotate(35deg);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 400px) {
      .bouquet {
        transform: scale(0.88);
        transform-origin: top center;
        margin-bottom: -45px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Ya te las di de verdad</h1>
    <p class="subtitle">Ahora asi...🤍</p>

    <div class="bouquet">
      <div class="stems">
        <div class="stem stem1"></div>
        <div class="stem stem2"></div>
        <div class="stem stem3"></div>
        <div class="stem stem4"></div>
        <div class="stem stem5"></div>
        <div class="stem stem6"></div>
        <div class="stem stem7"></div>
      </div>

      <div class="leaf leaf1"></div>
      <div class="leaf leaf2"></div>
      <div class="leaf leaf3"></div>
      <div class="leaf leaf4"></div>

      <div class="ball ball1"></div>
      <div class="ball ball2"></div>
      <div class="ball ball3"></div>
      <div class="ball ball4"></div>
      <div class="ball ball5"></div>
      <div class="ball ball6"></div>
      <div class="ball ball7"></div>

      <div class="wrapper"></div>
      <div class="ribbon"></div>
    </div>

    <p class="message">
      Porque te amo demasiado y me haces muy feliz 🤍
    </p>

    <button onclick="showMessage()">Picale Aqui</button>

    <p class="hidden-message" id="hiddenMessage">
      Holi, te amo 
               - Pao
    </p>
  </div>

  <script>
    function showMessage() {
      const message = document.getElementById("hiddenMessage");
      message.classList.toggle("show");

      if (message.classList.contains("show")) {
        createHearts();
      }
    }

    function createHearts() {
      for (let i = 0; i < 12; i++) {
        const heart = document.createElement("div");
        heart.className = "floating-heart";
        heart.textContent = "♥";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDelay = Math.random() * 2 + "s";
        heart.style.fontSize = 15 + Math.random() * 18 + "px";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 7000);
      }
    }
  </script>
</body>
</html>
